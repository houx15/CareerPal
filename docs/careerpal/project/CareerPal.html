<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CareerPal — AI 职业伙伴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="i18n.jsx"></script>
<script type="text/babel" src="slime.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="intro.jsx"></script>
<script type="text/babel" src="auth.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="match.jsx"></script>
<script type="text/babel" src="grow.jsx"></script>
<script type="text/babel" src="workspace.jsx"></script>

<script type="text/babel">
const { useState: useStateApp } = React;

function App() {
  // stage: intro | login | signup | name | onboarding | app
  const [stage, setStage] = useStateApp("intro");
  const [user, setUser] = useStateApp({ name: "", initials: "", email: "" });

  const handleLogin = ({ email, isNew }) => {
    setUser({ name: "", initials: "", email });
    setStage(isNew ? "name" : "app");
  };

  const handleName = (name) => {
    const initials = name.replace(/\s+/g, "").slice(0, 2).toUpperCase();
    setUser((u) => ({ ...u, name, initials }));
    setStage("onboarding");
  };

  const handleLogout = () => { setUser({ name: "", initials: "", email: "" }); setStage("intro"); };

  return (
    <>
      {stage === "intro" && <IntroPage onGetStarted={() => setStage("signup")} onSignIn={() => setStage("login")} />}
      {stage === "login" && <LoginScreen onBack={() => setStage("intro")} onLogin={handleLogin} onGoSignup={() => setStage("signup")} />}
      {stage === "signup" && <SignUpScreen onBack={() => setStage("intro")} onComplete={handleLogin} onGoLogin={() => setStage("login")} />}
      {stage === "name" && <NameIntro onSubmit={handleName} />}
      {stage === "onboarding" && <Onboarding user={user} onDone={() => setStage("app")} />}
      {stage === "app" && <Workspace user={user} onLogout={handleLogout} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <LangProvider><App /></LangProvider>
);
</script>
</body>
</html>
