[project]
name = "careerpal-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "email-validator>=2.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "oss2>=2.19",
  "passlib[bcrypt]>=1.7",
  "pydantic-settings>=2.4",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "python-jose[cryptography]>=3.3",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
